/* Layout: a dawn-coloured desktop; a floating glass toolbar; an iPhone running ReMind for the patient (iOS 27 idiom,
   Liquid Glass only on navigation, its own Dawn/Dusk palettes and a sky that follows the time of day) beside a macOS-style
   window for the doctor. Type: Source Serif 4 (italic for people and warm words), system/Inter for UI, Caveat for the
   doctor's handwritten note, mono for codes. Red/orange/yellow/green belong to clinical flags only. */
:root{
  --bg:#FAF8F4; --wall-a:#BCD2C5; --wall-b:#F4DCDD; --wall-c:#E0F7F5;
  --surface:#FFFFFF; --surface-2:#F2F2F7; --sunk:#E5E5EA; --fill:rgb(120 120 128 / .13); --fill-2:rgb(120 120 128 / .2);
  --ink:#111114; --ink-2:#3F3F46; --muted:#6C6C72; --line:#D1D1D6; --line-2:#E5E5EA;
  --accent:#81D8D0; --accent-ink:#0A7D85; --accent-soft:#E0F7F5; --on-accent:#FFFFFF;
  --glass-rgb:255 255 255; --glass-a:.6; --glass-solid:#F7F7F9; --glass-brd:rgb(255 255 255 / .75);
  --glass-sh:0 8px 28px rgb(0 0 0 / .12), inset 0 1px 0 rgb(255 255 255 / .7);
  --win:#F6F6F8; --p-card:#FFFFFF; --side:rgb(236 238 240 / .72); --zebra:#F7F7F9; --p-bg:#F6F6F8; --scene-base:var(--win);
  --d-sky-a:#CDEAE6; --d-sky-b:#EEE6F4; --sun:#F4AE5C; --sun-glow:rgb(244 174 92 / .3); --h1:rgb(10 125 133 / .13); --h2:rgb(10 125 133 / .22);
  --note-bg:#FFF6DD; --note-ink:#2B3A67;
  --red:#C8102E; --red-soft:#FDE8EA; --orange:#B84A00; --orange-soft:#FDEEDF;
  --yellow:#7F6200; --yellow-soft:#F8F0CC; --green:#1F7A3A; --green-soft:#DDF2E2;
  --frame:#1D1D1F; --frame-ring:#A7A9AC; --island:#000000;
  --crisis:#0B1C1E; --crisis-2:rgb(255 255 255 / .10); --crisis-3:#173236; --crisis-ink:#F2F7F7; --crisis-mute:#A9C0C0; --crisis-ok:#5FD3A8;
  --pop:0 18px 50px rgb(0 0 0 / .18);
  --win-sh:0 1px 0 rgb(255 255 255 / .6) inset, 0 22px 60px rgb(0 0 0 / .14), 0 0 0 1px rgb(0 0 0 / .08);
  /* constants: same in both themes */
  --tl-r:#FF5F57; --tl-y:#FEBC2E; --tl-g:#28C840;
  --ic-1:#0A7D85; --ic-2:#D63F74; --ic-3:#2E8B57; --ic-4:#3B5BDB; --ic-5:#8E5BD4; --ic-6:#6B7280; --ic-7:#D97100; --ic-red:#E5484D; --on-ic:#FFFFFF;
  --ava-a:#9BD8D2; --rose-a:#F4B6C8; --rose-b:#C2577D;
  --call:#2F9E4F; --sw-on:#34C759; --knob:#FFFFFF;
  --icon-a:#3BBDB4; --icon-b:#0A5A66; --icon-sun:#FFD08A; --icon-h1:rgb(255 255 255 / .3); --icon-h2:rgb(255 255 255 / .58); --icon-edge:rgb(255 255 255 / .4);
  --wp-a:#1C2A5E; --wp-b:#5B4485; --wp-c:#E9A27A; --wp-h1:rgb(22 18 52 / .55); --wp-h2:rgb(10 9 28 / .85); --on-wall:#FFFFFF; --wall-glass:rgb(28 26 48 / .42);
  --qr-bg:#FFFFFF;
  --dawn-1:#CBEAE6; --dawn-2:#F6E3E3; --dawn-3:#FFFFFF; --dusk-1:#1B2250; --dusk-2:#3A2550; --dusk-3:#171826;

  --f-serif:"Source Serif 4","New York",ui-serif,Georgia,"Times New Roman",serif;
  --f-hand:"Caveat","Segoe Print","Bradley Hand",cursive;
  --f-mono:ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
  --top-h:64px;
}

html,body{height:100%}
body{background:radial-gradient(55% 60% at 8% 4%,var(--wall-a),transparent 70%),radial-gradient(50% 55% at 96% 10%,var(--wall-c),transparent 72%),radial-gradient(60% 60% at 60% 105%,var(--wall-b),transparent 70%),var(--bg);
  background-attachment:fixed;color:var(--ink);font-family:var(--f-ui);font-size:13.5px;line-height:1.42;display:flex;flex-direction:column;-webkit-font-smoothing:antialiased;letter-spacing:-.003em}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--f-mono)}
.serif{font-family:var(--f-serif);font-weight:600;letter-spacing:-.012em;font-optical-sizing:auto;text-wrap:balance}
.serif em,em.serif{font-style:italic;font-weight:500}
.disp{font-family:var(--f-serif);font-weight:600;letter-spacing:-.012em;text-wrap:balance}
.wm{font-family:var(--f-serif);font-style:italic;font-weight:600;letter-spacing:-.02em;line-height:1;white-space:nowrap}
.wm i{font-style:italic;font-weight:500;color:var(--accent-ink);letter-spacing:-.01em}
.wm b{font-style:normal;font-weight:650;letter-spacing:-.03em}
.hand{font-family:var(--f-hand);font-weight:600}
.muted{color:var(--muted)}
.center{text-align:center}
.glass{background:rgb(var(--glass-rgb) / var(--glass-a));-webkit-backdrop-filter:blur(20px) saturate(180%);backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--glass-brd);box-shadow:var(--glass-sh)}
@media (prefers-reduced-transparency: reduce){.glass{background:var(--glass-solid);-webkit-backdrop-filter:none;backdrop-filter:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes up{from{transform:translateY(8px)}to{transform:none}}

/* ---------- floating toolbar ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;flex:none;padding-block:10px 4px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:1520px;margin:0 auto;min-height:48px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:6px 6px 6px 8px;border-radius:26px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .wm{font-size:24px}
.brand small{color:var(--muted);font-size:12.5px;margin-left:4px}
.seg{display:inline-flex;background:var(--fill);border-radius:999px;padding:3px;gap:2px;margin-left:auto}
.seg button{border:0;background:transparent;color:var(--ink-2);border-radius:999px;padding:7px 15px;font-weight:600;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 2px 8px rgb(0 0 0 / .12)}
.seg .both{display:none}
@media (min-width:1100px){.seg .both{display:inline-flex}}
.badge{min-width:18px;height:18px;padding:0 5px;border-radius:9px;font-size:11px;font-weight:700;display:inline-grid;place-items:center;line-height:1}
.badge.red{background:var(--red);color:var(--surface)}
.badge.orange{background:var(--orange);color:var(--surface)}
.badge.tint{background:var(--accent);color:var(--on-accent)}
.theme-btn{flex:none;width:38px;height:38px;border:0;border-radius:50%;background:var(--fill);color:var(--ink);display:grid;place-items:center;transition:background .15s}
.theme-btn:hover{background:var(--fill-2)}
.theme-btn svg{transition:transform .35s cubic-bezier(.2,.8,.2,1)}
.theme-btn:active svg{transform:rotate(-40deg) scale(.9)}
.demo-btn{border:0;background:var(--accent);color:var(--on-accent);border-radius:999px;padding:8px 15px;font-size:13px;font-weight:600;box-shadow:inset 0 1px 0 rgb(255 255 255 / .3)}
.demo-btn .short{display:none}
@media (max-width:560px){.brand small{display:none}.demo-btn .long{display:none}.demo-btn .short{display:inline}.top-in{gap:8px}}
@media (max-width:440px){.brand{display:none}.seg{margin-left:0}.seg button{padding:7px 11px}.theme-btn{width:36px;height:36px;margin-left:auto}}

/* ---------- stage ---------- */
.app{flex:1;min-height:0;width:100%;max-width:1520px;margin:0 auto;display:flex;flex-direction:column;padding-top:10px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stage{flex:1;min-height:0;display:grid;gap:24px;padding-bottom:12px}
.stage.m-patient{grid-template-columns:minmax(0,1fr);justify-items:center}
.stage.m-doctor{grid-template-columns:minmax(0,1fr)}
.stage.m-both{grid-template-columns:404px minmax(0,1fr)}
.col-cap{font-size:12.5px;color:var(--muted);font-weight:500;margin:0 0 8px 4px}
.col-cap b{color:var(--ink);font-weight:600}
.pcol{display:flex;flex-direction:column;align-items:center;min-height:0}

/* ---------- iPhone ---------- */
.phone{position:relative;width:392px;max-width:100%;height:min(840px,calc(100dvh - var(--top-h) - 88px));min-height:620px;
  border:11px solid var(--frame);border-radius:58px;box-shadow:0 0 0 1.5px var(--frame-ring),0 30px 60px rgb(0 0 0 / .22);
  overflow:hidden;background:var(--p-bg);display:flex;flex-direction:column;font-size:17px;line-height:1.35;color:var(--ink);--chrome:var(--ink)}
.phone.lockmode{--chrome:var(--on-wall)}
.phone.crisismode{--chrome:var(--crisis-ink)}
.island{position:absolute;top:10px;left:50%;transform:translateX(-50%);width:118px;height:34px;border-radius:20px;background:var(--island);z-index:40}
.ph-bar{position:absolute;top:0;left:0;right:0;height:54px;z-index:35;display:flex;justify-content:space-between;align-items:center;padding:4px 30px 0 40px;font-size:16px;font-weight:600;color:var(--chrome);pointer-events:none}
.ph-bar .sys{display:flex;gap:6px;align-items:center}
.ph-edge{position:absolute;top:0;left:0;right:0;height:62px;z-index:4;pointer-events:none;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);-webkit-mask-image:linear-gradient(#000 45%,transparent);mask-image:linear-gradient(#000 45%,transparent)}
.home-ind{position:absolute;bottom:7px;left:50%;transform:translateX(-50%);width:132px;height:5px;border-radius:3px;background:var(--chrome);opacity:.85;z-index:41}
@media (max-width:560px){
  .phone{width:100%;border:0;border-radius:0;box-shadow:none;height:calc(100dvh - var(--top-h) - 36px);min-height:580px}
  .island,.home-ind,.ph-bar{display:none}
  .stage.m-patient{justify-items:stretch;margin-left:calc(-1 * max(16px,env(safe-area-inset-left,0px)));margin-right:calc(-1 * max(16px,env(safe-area-inset-right,0px)))}
  .pcol .col-cap{display:none}
  .app{padding-top:4px}
}
.phone.big .ph-scroll,.phone.big .ov-body,.phone.big .scr{zoom:1.1}
.appicon{display:block;flex:none}
.appicon.lift{filter:drop-shadow(0 14px 24px rgb(10 60 70 / .28))}

/* notification banner */
.banner{position:absolute;top:50px;left:10px;right:10px;z-index:30;display:flex;gap:12px;align-items:center;text-align:left;border-radius:26px;padding:11px 14px;color:var(--ink);animation:drop .38s cubic-bezier(.2,.8,.2,1)}
.banner > span{flex:1;min-width:0;display:flex;flex-direction:column}
.banner b{font-size:15px}
.bn-app{font-size:13px;color:var(--muted);font-weight:600}
.bn-app i{font-style:normal;font-weight:400;margin-left:6px}
.bn-t{font-size:15px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@keyframes drop{from{transform:translateY(-36px);opacity:0}to{transform:none;opacity:1}}

/* full-screen screens: welcome, onboarding, registration, login */
.scr{position:absolute;inset:0;z-index:2;display:flex;flex-direction:column;padding:70px 24px 34px;overflow-y:auto;scrollbar-width:none;
  background:linear-gradient(180deg,var(--sky-a) 0%,var(--sky-b) 52%,var(--p-bg) 100%)}
.scr::-webkit-scrollbar{display:none}
.scr > *{flex-shrink:0}
.scene{position:absolute;left:0;right:0;bottom:0;width:100%;height:56%;pointer-events:none}
.scene .sun-glow{animation:glow 6s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes glow{50%{opacity:.55;transform:scale(1.06)}}
.scene.rise .sun,.scene.rise .sun-glow{animation:risesun 1.8s cubic-bezier(.2,.7,.2,1) both}
@keyframes risesun{from{transform:translateY(70px)}to{transform:none}}
.wl-mid{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding-bottom:36px}
.welcome .wm{font-size:56px}
.wl-tag{font-size:19px;color:var(--ink-2);margin:0;text-wrap:balance}
.wl-tag em{font-family:var(--f-serif);font-style:italic;font-weight:500;font-size:21px;color:var(--ink)}
.wl-foot{position:relative;z-index:1;display:flex;flex-direction:column;gap:6px}
.lg-h{font-size:32px;line-height:1.1;margin:6px 0 0}
.ob{gap:16px}
.ob-top{display:flex;justify-content:flex-end;min-height:44px}
.ob-art{flex:1;display:grid;place-items:center;min-height:250px;position:relative}
.ob-art::before{content:"";position:absolute;width:250px;height:250px;border-radius:50%;background:radial-gradient(circle,var(--sun-glow),transparent 70%);top:50%;left:50%;transform:translate(-50%,-55%)}
.ob-card{position:relative;border-radius:30px;padding:20px;width:100%;max-width:312px;display:flex;flex-direction:column;gap:14px}
.ob-q{font-size:22px;margin:0}
.ob-h{font-size:35px;line-height:1.06;margin:0}
.ob-p{font-size:18px;color:var(--ink-2);margin:-4px 0 0;text-wrap:balance}
.ob-foot{display:flex;flex-direction:column;gap:18px}
.ob-foot .dots{justify-content:flex-start}
.ob-doc{display:flex;align-items:center;gap:10px}
.ob-doc b{display:block;font-size:16px}.ob-doc small{font-size:14px;color:var(--muted)}
.ob-chart{width:100%;height:auto;display:block}
.ob3{align-items:stretch}
.acc-demo{display:flex;align-items:center;justify-content:center;gap:10px;border-radius:999px;min-height:54px;background:var(--crisis);color:var(--crisis-ink);font-weight:600;font-size:17px}
.ob3-row{display:flex;align-items:center;gap:14px;padding:4px 6px}
.ob3-row b{display:block;font-size:30px;font-weight:800;letter-spacing:-.02em;line-height:1}
.ob3-row small{font-size:14px;color:var(--muted)}
.reg{background:linear-gradient(180deg,var(--sky-a) 0,var(--p-bg) 320px);gap:16px}
.rg-head{display:grid;grid-template-columns:46px minmax(0,1fr) 46px;align-items:center;margin-top:-10px}
.rg-h{font-size:34px;line-height:1.07;margin:10px 0 0}
.rg-p{font-size:17px;color:var(--ink-2);margin:-4px 0 4px;text-wrap:pretty}
.field{display:flex;align-items:center;gap:10px;background:var(--p-card);border-radius:20px;padding:2px 18px;min-height:64px;box-shadow:0 0 0 1px var(--line-2)}
.field:focus-within{box-shadow:0 0 0 2px var(--accent)}
.field input{flex:1;min-width:0;border:0;background:transparent;color:var(--ink);font:inherit;font-size:22px;font-weight:600;padding:12px 0;outline:none}
.field input::placeholder{color:var(--muted);opacity:.6;font-weight:500}
.field .pre{font-size:22px;font-weight:600;color:var(--muted)}
.field .lab{font-size:15px;color:var(--muted);width:72px;flex:none;font-weight:500}
.field.sm{min-height:56px}.field.sm input{font-size:18px}
.field.otp input{text-align:center;letter-spacing:.55em;font-family:var(--f-mono);font-size:34px;padding-left:.55em}
.field.mono input{font-family:var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.hint-pill{align-self:flex-start;display:inline-flex;align-items:center;gap:8px;border:0;border-radius:999px;background:var(--fill);color:var(--accent-ink);padding:9px 14px;font-size:15px;font-weight:600}
.otp-sug{align-self:center;display:inline-flex;align-items:center;gap:8px;border:0;border-radius:14px;background:var(--p-card);box-shadow:0 0 0 1px var(--line-2);padding:10px 16px;font-size:16px;color:var(--ink)}
.otp-sug b{font-family:var(--f-mono);letter-spacing:.08em}
.err{color:var(--red);font-size:15px;font-weight:600;margin:0}
.rg-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding-top:12px}
.doc-ok{display:flex;gap:14px;align-items:center;background:var(--p-card);border-radius:24px;padding:16px}
.doc-ok b{display:block;font-size:20px}.doc-ok span:not(.ava){display:block;color:var(--muted);font-size:15px}
.req{font-style:normal;font-size:12px;font-weight:600;color:var(--accent-ink);background:var(--accent-soft);border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:2px;white-space:nowrap}
.preview{background:var(--p-card);border-radius:22px;padding:14px 18px;display:flex;flex-direction:column;gap:2px}
.pv-l{font-size:13px;color:var(--muted);font-weight:600}
.greet-pv{font-size:28px;margin:0}
.times{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt.tm{flex-direction:column;align-items:flex-start;gap:2px;background:var(--p-card);border-radius:22px;min-height:92px;padding:12px 16px}
.opt.tm svg{color:var(--m5)}
.opt.tm b{font-size:24px;font-variant-numeric:tabular-nums}
.opt.tm small{font-size:14px;color:var(--muted);font-weight:500}
.opt.tm[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.opt.tm[aria-pressed="true"] small,.opt.tm[aria-pressed="true"] svg{color:var(--on-accent)}
.npv{display:flex;gap:12px;align-items:center;border-radius:24px;padding:12px 14px;color:var(--ink)}
.npv > span{flex:1;min-width:0;display:flex;flex-direction:column}
.npv b{font-size:15px}
.npv .bn-t{white-space:normal}
.banner .bn-t{white-space:normal;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.fid-big{align-self:center;margin-top:34px;width:132px;height:132px;border-radius:36px;display:grid;place-items:center;background:var(--p-card);color:var(--accent);box-shadow:0 12px 30px rgb(0 0 0 / .08)}
.done-scr .wl-mid{justify-content:flex-start;padding-top:40px}
.done-h{font-size:40px;line-height:1.05;margin:0}

/* Face ID, system alert */
.fid-wrap{position:absolute;inset:0;z-index:45;display:grid;place-items:center;background:rgb(0 0 0 / .16);animation:fade .2s}
.fid{width:150px;height:150px;border-radius:36px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--ink);font-size:15px;font-weight:600;
  background:rgb(var(--glass-rgb) / .82);-webkit-backdrop-filter:blur(24px);backdrop-filter:blur(24px);box-shadow:var(--glass-sh)}
.fid.scan svg{animation:scan .85s ease-in-out}
@keyframes scan{0%{transform:scale(.88);opacity:.4}55%{transform:scale(1.06);opacity:1}100%{transform:scale(1)}}
.fid.ok svg{color:var(--sw-on)}
.al-wrap{position:absolute;inset:0;z-index:44;display:grid;place-items:center;background:rgb(0 0 0 / .32);animation:fade .2s}
.alert{width:280px;border-radius:26px;overflow:hidden;text-align:center;background:rgb(var(--glass-rgb) / .92);-webkit-backdrop-filter:blur(30px);backdrop-filter:blur(30px);color:var(--ink);box-shadow:var(--pop)}
.alert > b{display:block;padding:20px 18px 4px;font-size:17px;line-height:1.3}
.alert p{margin:0;padding:4px 18px 18px;font-size:14px;color:var(--ink-2)}
.al-btns{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line)}
.al-btns button{border:0;background:transparent;color:var(--accent-ink);font-size:17px;padding:13px 6px;min-height:50px}
.al-btns button + button{border-left:1px solid var(--line)}
.al-btns .danger{color:var(--red)}

/* lock screen */
.lock{position:absolute;inset:0;z-index:2;color:var(--on-wall);display:flex;flex-direction:column;align-items:center;padding:58px 12px 30px;overflow:hidden}
.lock-wall{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.lk-top{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:6px;text-shadow:0 1px 12px rgb(0 0 0 / .18)}
.lk-date{margin:6px 0 0;font-size:19px;font-weight:600;opacity:.92}
.lk-time{margin:0;font-size:96px;line-height:1;font-weight:700;letter-spacing:-.045em;opacity:.94}
.lk-stack{margin-top:auto;width:100%;display:flex;flex-direction:column;gap:10px;margin-bottom:84px}
.glass-dark{background:var(--wall-glass);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);border:1px solid rgb(255 255 255 / .14)}
.lk-n{display:flex;gap:12px;align-items:center;text-align:left;border-radius:26px;padding:13px 14px;color:var(--on-wall);width:100%}
.lk-t{flex:1;min-width:0;display:flex;flex-direction:column}
.lk-app{font-size:13px;font-weight:600;opacity:.78}
.lk-app i{font-style:normal;font-weight:400;margin-left:6px}
.lk-t b{font-size:16px}
.lk-t span:last-child{font-size:15px;opacity:.86}
.lk-n.exp{flex-direction:column;align-items:stretch;gap:12px;padding:14px}
.lk-row{display:flex;align-items:center;gap:8px}
.lk-x{margin-left:auto;border:0;width:30px;height:30px;border-radius:50%;background:rgb(255 255 255 / .16);color:var(--on-wall);display:grid;place-items:center}
.lk-q{font-size:25px;margin:0}
.lk-faces .face{color:var(--on-wall)}
.lk-faces .face span{color:var(--on-wall);opacity:.85}
.lk-faces .face:hover{background:rgb(255 255 255 / .12)}
.lk-done{display:flex;gap:12px;align-items:center}
.lk-done b{display:block;font-size:17px}
.lk-done span{font-size:15px;opacity:.85}
.lk-open{border:0;border-radius:999px;background:var(--on-wall);color:var(--wp-a);font-weight:600;font-size:16px;padding:12px}
.lk-hint{text-align:center;font-size:14px;opacity:.75;margin:0}
.lk-bottom{position:absolute;left:46px;right:46px;bottom:46px;display:flex;justify-content:space-between}
.lk-btn{width:50px;height:50px;border-radius:50%;display:grid;place-items:center;color:var(--on-wall)}
.lk-swipe{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);border:0;background:transparent;color:var(--on-wall);opacity:.8;font-size:13px;font-weight:600;white-space:nowrap}

/* app shell */
.ph-scroll{flex:1;overflow-y:auto;padding:60px 18px 188px;display:flex;flex-direction:column;gap:14px;scrollbar-width:none;
  background:linear-gradient(180deg,var(--sky-a) 0,var(--sky-b) 220px,var(--p-bg) 440px) no-repeat;background-attachment:local}
.ph-scroll::-webkit-scrollbar{display:none}
.ph-scroll > *,.list > *,.ov-body > *{flex-shrink:0}
.ph-fade{position:absolute;left:0;right:0;bottom:0;height:210px;pointer-events:none;z-index:3;background:linear-gradient(transparent,var(--p-bg) 58%)}
@media (max-width:560px){.ph-scroll{padding-top:14px}}
.ph-top{padding:6px 4px 4px;display:flex;flex-direction:column;gap:4px}
.ph-top.row{flex-direction:column;align-items:center;gap:6px;text-align:center}
.home-nav{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:2px 2px 0 4px}
.ph-date{font-size:15px;color:var(--muted);margin:0;font-weight:500}
.ava-btn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:15px;color:var(--accent-ink);flex:none}
.ph-h1{font-size:34px;line-height:1.08;font-weight:700;letter-spacing:-.025em;margin:0;text-wrap:balance}
.ph-h1.serif{font-weight:600;letter-spacing:-.015em}
.greet{font-size:40px;line-height:1.02;padding:0 4px}
.ph-h1.sm{font-size:21px;letter-spacing:-.01em}
.ph-h2{font-size:20px;font-weight:700;margin:6px 4px 0;letter-spacing:-.015em}
.gh{font-size:15px;font-weight:600;color:var(--muted);margin:8px 18px -6px}
.ph-sub{font-size:17px;color:var(--ink-2);margin:0}
.ph-sub b{color:var(--ink)}
.fine{font-size:14px;color:var(--muted);margin:0;padding:0 6px}
.pcard{background:var(--p-card);border-radius:28px;padding:18px;display:flex;flex-direction:column;gap:14px}
.ch-h{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:600;color:var(--accent-ink)}
.ch-h span{margin-left:auto;color:var(--muted);font-weight:500;font-size:14px}
.ph-q{font-size:24px;margin:0}
.faces{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}
.face{border:0;background:transparent;border-radius:22px;padding:10px 0 8px;display:flex;flex-direction:column;align-items:center;gap:6px;color:var(--ink-2);min-width:0;transition:background .15s,color .15s,transform .12s}
.face svg{width:48px;height:48px}
.ov .face svg{width:54px;height:54px}
.face span{font-size:13px;line-height:1.15;text-align:center;min-height:2.3em;padding:0 2px;font-weight:500}
.face:active{transform:scale(.94)}
.faces.mini .face{pointer-events:none;padding:6px 0}
.faces.mini .face svg{width:40px;height:40px}
.face.m1[aria-pressed="true"],.face.m1.on{background:var(--m1s);color:var(--ink-2)} .face.m1[aria-pressed="true"] svg,.face.m1.on svg{color:var(--m1)}
@media (hover:hover){.face.m1:hover{background:var(--m1s)}}
.face.m2[aria-pressed="true"],.face.m2.on{background:var(--m2s);color:var(--ink-2)} .face.m2[aria-pressed="true"] svg,.face.m2.on svg{color:var(--m2)}
@media (hover:hover){.face.m2:hover{background:var(--m2s)}}
.face.m3[aria-pressed="true"],.face.m3.on{background:var(--m3s);color:var(--ink-2)} .face.m3[aria-pressed="true"] svg,.face.m3.on svg{color:var(--m3)}
@media (hover:hover){.face.m3:hover{background:var(--m3s)}}
.face.m4[aria-pressed="true"],.face.m4.on{background:var(--m4s);color:var(--ink-2)} .face.m4[aria-pressed="true"] svg,.face.m4.on svg{color:var(--m4)}
@media (hover:hover){.face.m4:hover{background:var(--m4s)}}
.face.m5[aria-pressed="true"],.face.m5.on{background:var(--m5s);color:var(--ink-2)} .face.m5[aria-pressed="true"] svg,.face.m5.on svg{color:var(--m5)}
@media (hover:hover){.face.m5:hover{background:var(--m5s)}}

.face[aria-pressed="true"] span,.face.on span{font-weight:700}
.today-done{display:flex;gap:14px;align-items:center}
.today-done svg{flex:none}
.today-done div{flex:1;min-width:0;color:var(--ink)}
.today-done b{display:block;font-size:19px}
.today-done span{color:var(--ink-2)}
.lnk{border:0;background:var(--fill);color:var(--accent-ink);font-weight:600;font-size:15px;padding:8px 14px;border-radius:999px;min-height:40px;display:inline-flex;align-items:center;gap:4px}
.lnk.left{align-self:flex-start}
/* inset grouped list */
.list{background:var(--p-card);border-radius:28px;overflow:hidden;display:flex;flex-direction:column}
.lrow{position:relative;display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:0;background:transparent;padding:12px 16px;min-height:62px;color:var(--ink)}
.lrow + .lrow::before{content:"";position:absolute;top:0;left:62px;right:0;height:1px;background:var(--line-2)}
.lrow.tel + .lrow.tel::before,.list.plain .lrow + .lrow::before{left:16px}
button.lrow:active,a.lrow:active{background:var(--fill)}
a.lrow{text-decoration:none;color:var(--ink)}
.sq{flex:none;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--on-ic);background:var(--ic-1)}
.sq.c1{background:var(--ic-1)}.sq.c2{background:var(--ic-2)}.sq.c3{background:var(--ic-3)}.sq.c4{background:var(--ic-4)}.sq.c5{background:var(--ic-5)}.sq.c6{background:var(--ic-6)}.sq.c7{background:var(--ic-7)}.sq.red-sq{background:var(--ic-red)}.sq.crisis-sq{background:var(--crisis)}
.lrow > span:not(.sq):not(.chev):not(.call):not(.val):not(.ava):not(.ck){flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.lrow b{font-size:17px;font-weight:600}
.lrow small{font-size:15px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lrow small.wrap,.lrow .wrap{white-space:normal}
.lrow .chev{flex:none;color:var(--line)}
.lrow .val{flex:none;color:var(--muted);font-size:16px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow.new b::after{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--accent);margin-left:8px;vertical-align:middle}
.lrow.center{justify-content:center}
.lrow.center > span{align-items:center}
.lrow.danger b{color:var(--red)}
.lrow .ck{margin-left:auto;color:var(--accent);flex:none}
.lrow.btns{gap:8px;justify-content:flex-start;padding-left:62px;min-height:54px}
.call{flex:none;width:44px;height:44px;border-radius:50%;background:var(--call);color:var(--on-ic);display:grid;place-items:center}
.pbtn{border:0;border-radius:999px;min-height:56px;padding:12px 20px;width:100%;font-size:17px;font-weight:600;background:var(--accent);color:var(--on-accent);display:flex;align-items:center;justify-content:center;gap:10px;box-shadow:inset 0 1px 0 rgb(255 255 255 / .28);transition:transform .12s}
.pbtn:active{transform:scale(.98)}
.pbtn:disabled{opacity:.38;cursor:not-allowed}
.pbtn.soft{background:var(--accent-soft);color:var(--accent-ink);box-shadow:none}

.note-s{font-size:11.5px;color:var(--muted);margin:0}
.dcol{min-width:0;min-height:0;display:flex;flex-direction:column}
.doc{position:relative;flex:1;min-height:0;display:flex;flex-direction:column;background:var(--win);border-radius:24px;overflow:hidden;box-shadow:var(--win-sh);
  height:calc(100dvh - var(--top-h) - 88px);container-type:inline-size;container-name:win}
.wbar{flex:none;display:flex;align-items:center;gap:14px;padding:10px 14px;min-height:56px}
.tl{display:flex;gap:8px;flex:none}
.tl i{width:12px;height:12px;border-radius:50%;background:var(--tl-r)}.tl i:nth-child(2){background:var(--tl-y)}.tl i:nth-child(3){background:var(--tl-g)}
.wbrand{display:flex;align-items:center;gap:8px;flex:none}
.wm.sm{font-size:21px}
.wbrand small{font-size:12.5px;color:var(--muted)}
.wtitle{display:flex;align-items:baseline;gap:6px;font-size:14px;color:var(--muted)}
.dnav{display:flex;gap:2px;background:var(--fill);border-radius:999px;padding:3px;overflow-x:auto;scrollbar-width:none;min-width:0}
.dnav::-webkit-scrollbar{display:none}
.dnav button{border:0;background:transparent;border-radius:999px;padding:6px 12px;display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--ink-2);white-space:nowrap;flex:none}
.dnav button[aria-current="page"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 5px rgb(0 0 0 / .14)}
.wtools{margin-left:auto;display:flex;gap:8px;align-items:center;flex:none}
.wava{width:34px;height:34px;border-radius:50%;border:0;background:linear-gradient(160deg,var(--ava-a),var(--ic-1));color:var(--on-ic);font-weight:700;font-size:12.5px;flex:none}
.wava[aria-current="true"]{box-shadow:0 0 0 2px var(--win),0 0 0 4px var(--accent)}
@container win (max-width: 1000px){.wbrand small,.wtools .lbl{display:none}}
@container win (max-width: 880px){.wbrand .wm{display:none}.dnav .lbl{display:none}.dnav button{padding:6px 10px}}
.wbody{flex:1;min-height:0;display:flex;flex-direction:column;position:relative}
.wbody.v-patients{display:flex;flex-direction:column;padding:0 8px 8px}
.wbody.v-messages{display:grid;grid-template-columns:300px minmax(0,1fr);padding:0 8px 8px}
.wscroll{flex:1;min-height:0;overflow-y:auto;padding:6px 26px 28px;display:flex;flex-direction:column;gap:18px}
.wscroll > *{flex-shrink:0}
@media (max-width:860px){
  .app{height:auto;min-height:100%}
  .stage{flex:none}
  .doc{height:auto;overflow:visible}
  .wbody.v-patients,.wbody.v-messages{grid-template-columns:minmax(0,1fr)}
  .dl{max-height:360px}
  .dc,.wscroll{overflow:visible;padding:12px 12px 20px}
  .dlogin{grid-template-columns:minmax(0,1fr)!important}
  .dl-art{min-height:300px}
}
/* login */
.dlogin{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:8px;padding:0 8px 8px}
.dlogin.one{grid-template-columns:minmax(0,1fr);place-items:center}
.dl-art{position:relative;border-radius:18px;overflow:hidden;background:linear-gradient(180deg,var(--d-sky-a),var(--d-sky-b) 62%,var(--win));display:flex;flex-direction:column;padding:38px 34px}
.dl-art .scene{height:40%}
.dl-art-in{position:relative;z-index:1;display:flex;flex-direction:column;gap:16px;max-width:430px}
.wm.xl{font-size:58px}
.dl-claim{font-size:30px;line-height:1.14;margin:0}
.dl-feat{list-style:none;margin:4px 0 0;padding:0;display:flex;flex-direction:column;gap:10px;font-size:15px;color:var(--ink-2)}
.dl-feat li{display:flex;gap:10px;align-items:center}
.dl-feat svg{color:var(--accent);flex:none}
.dl-form{align-self:center;justify-self:center;width:min(380px,100%);display:flex;flex-direction:column;gap:12px;padding:24px}
.dl-form h2{font-size:34px;margin:0;line-height:1.08}
.dfield{display:flex;flex-direction:column;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted)}
.dfield input,.dfield select,.dfield textarea{font:inherit;font-size:15px;font-weight:500;color:var(--ink);background:var(--surface);border:0;border-radius:12px;padding:11px 12px;box-shadow:0 0 0 1px var(--line);outline:none;width:100%}
.dfield textarea{min-height:72px;resize:vertical}
.dfield input:focus,.dfield select:focus{box-shadow:0 0 0 2px var(--accent)}
.dcheck{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--ink-2)}
.dcheck input{accent-color:var(--accent);width:16px;height:16px}
.otp6{font-size:30px;text-align:center;letter-spacing:.3em;border:0;border-radius:14px;background:var(--surface);box-shadow:0 0 0 1px var(--line);padding:12px;color:var(--ink);font-family:var(--f-mono);width:100%}
.otp6:focus{outline:none;box-shadow:0 0 0 2px var(--accent)}
.dl-key{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-ink)}
.lnk-d{border:0;background:transparent;color:var(--accent-ink);font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:4px;align-self:flex-start;padding:4px 0}
/* dashboard */
.dhead{display:flex;flex-direction:column;gap:2px;padding-top:4px}
.dh-date{margin:0;font-size:13.5px;color:var(--muted);font-weight:500}
.dh-date::first-letter{text-transform:uppercase}
.dh-h{font-size:38px;line-height:1.06;margin:0}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@container win (max-width: 760px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{border:0;text-align:left;background:var(--surface);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;box-shadow:0 0 0 1px var(--line-2);color:var(--ink);min-width:0}
button.kpi:hover{box-shadow:0 0 0 1px var(--line)}
.k-l{display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;color:var(--muted)}
.kpi b{font-size:36px;font-weight:800;letter-spacing:-.035em;line-height:1.02;font-variant-numeric:tabular-nums}
.kpi b i{font-style:normal;font-size:16px;font-weight:600;color:var(--muted);letter-spacing:0}
.kpi small{font-size:12px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.kpi.k-red{background:var(--red-soft);box-shadow:0 0 0 1px var(--red-soft)}
.kpi.k-red b,.kpi.k-red .k-l{color:var(--red)}
.kpi.k-orange b,.kpi.k-orange .k-l{color:var(--orange)}
.kbar{display:block;height:6px;border-radius:3px;background:var(--fill);overflow:hidden;margin-top:4px}
.kbar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.dgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@container win (max-width: 760px){.dgrid{grid-template-columns:minmax(0,1fr)}}
.dcard{background:var(--surface);border-radius:20px;padding:14px 16px;display:flex;flex-direction:column;gap:4px;box-shadow:0 0 0 1px var(--line-2);min-width:0}
.flagstrip{display:flex;gap:22px;align-items:center;flex-wrap:wrap;background:linear-gradient(180deg,var(--surface),color-mix(in srgb,var(--accent-soft) 35%,var(--surface)));border-radius:22px;padding:14px 20px;box-shadow:0 0 0 1px var(--line-2)}
.flagstrip span{display:flex;align-items:center;gap:10px;font-size:13.5px;color:var(--ink-2)}
.flagstrip b{font-size:22px;letter-spacing:-.04em;color:var(--ink);font-variant-numeric:tabular-nums}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block;box-shadow:0 0 0 5px var(--halo)}
.dot.r{background:var(--red);--halo:var(--red-soft)}.dot.o{background:var(--orange);--halo:var(--orange-soft)}.dot.y{background:var(--yellow);--halo:var(--yellow-soft)}
.today-split{display:grid;grid-template-columns:minmax(0,1fr) 292px;gap:14px;align-items:start}
@container win (max-width: 760px){.today-split{grid-template-columns:minmax(0,1fr)}}
.side-rail{display:flex;flex-direction:column;gap:10px}
button.rail{border:0;text-align:left;width:100%;background:var(--surface);border-radius:20px;padding:15px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 0 0 1px var(--line-2);color:var(--ink);transition:transform .16s ease,box-shadow .16s ease}
button.rail:hover{transform:translateY(-2px);box-shadow:0 10px 26px rgb(0 0 0 / .07),0 0 0 1px var(--line)}
.rail-ic{width:42px;height:42px;border-radius:14px;background:linear-gradient(160deg,var(--accent),var(--accent-ink));color:#fff;display:grid;place-items:center;flex:none;box-shadow:inset 0 1px 0 rgb(255 255 255 / .35)}
.rail b{display:block;font-size:15.5px;letter-spacing:-.02em}
.rail small{display:block;color:var(--muted);font-weight:500;font-size:12.5px;margin-top:2px}
.hist{background:var(--surface);border-radius:22px;padding:8px 6px 16px;box-shadow:0 0 0 1px var(--line-2);margin:0 0 14px}
.hist-grid{display:grid;grid-template-columns:minmax(120px,168px) minmax(0,1fr);gap:10px 16px;margin:0;padding:6px 14px 2px}
.hist-grid dt{color:var(--muted);font-size:12px;font-weight:650;letter-spacing:.01em;padding-top:3px}
.hist-grid dd{margin:0;font-size:14.5px;line-height:1.4;color:var(--ink)}
.cta-eval{width:calc(100% - 28px);margin:14px 14px 0;border:0;border-radius:16px;min-height:52px;padding:0 18px;background:linear-gradient(180deg,#2ad4c8,#0A7D85);color:#fff;font-weight:700;font-size:16px;letter-spacing:-.01em;box-shadow:0 12px 28px rgb(10 125 133 / .28),inset 0 1px 0 rgb(255 255 255 / .4)}
.cta-eval:hover{filter:brightness(1.06)}
.ask-card{background:linear-gradient(160deg,var(--accent-soft),var(--p-card));border-radius:22px;padding:16px 16px 14px;margin:4px 0 14px;box-shadow:0 0 0 1px color-mix(in srgb,var(--accent) 35%,transparent)}
.ask-card p{margin:0 0 12px;font-size:16px;line-height:1.4;color:var(--ink)}
.scale-due{display:flex;flex-direction:column;gap:8px;margin:4px 0 12px}
.scale-ico{border:0;text-align:left;width:100%;display:flex;gap:12px;align-items:center;background:var(--p-card);border-radius:18px;padding:12px 14px;box-shadow:0 0 0 1px color-mix(in srgb, var(--accent) 45%, transparent);color:var(--ink)}
.scale-ico b{display:block;font-size:15px}
.scale-ico small{display:block;color:var(--muted);font-weight:500}
.med-card{position:relative;margin-bottom:12px}
.med-acts{display:flex;gap:8px;flex-wrap:wrap}
.med-mark{position:absolute;right:14px;bottom:14px;width:30px;height:30px;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:700;box-shadow:0 6px 14px rgb(0 0 0 / .14)}
.med-mark.ok{background:#22c55e}.med-mark.no{background:#ef4444}
.chiprow{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.verdict{margin-top:10px;border-radius:16px;padding:12px 14px;background:var(--accent-soft);color:var(--ink);font-size:14px;line-height:1.45}
.manual-drug{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.manual-drug input{flex:1;min-width:160px;padding:10px 12px;border-radius:12px;border:0;box-shadow:0 0 0 1px var(--line);background:var(--surface);color:var(--ink);font:inherit}
.month-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.visit-layout{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(280px,.8fr);gap:14px;align-items:start}
@container win (max-width: 860px){.visit-layout,.month-grid{grid-template-columns:minmax(0,1fr)}}
.ai-card{border-radius:16px;padding:12px;background:var(--accent-soft);display:flex;flex-direction:column;gap:6px}
.ai-card small{color:var(--muted)}
.pill.demo{background:var(--note-bg);color:var(--note-ink)}
.dcard.span2{grid-column:1/-1}
.dc-t{font-family:var(--f-serif);font-size:21px;font-weight:600;margin:0 0 4px;letter-spacing:-.01em}
.arow{border:0;background:transparent;display:flex;align-items:center;gap:12px;padding:9px 8px;border-radius:12px;text-align:left;color:var(--ink);width:100%}
.plist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.plist li button{width:100%;border:0;background:var(--surface);text-align:left;display:flex;gap:12px;padding:12px;align-items:center;border-radius:18px;box-shadow:0 0 0 1px var(--line-2);color:var(--ink)}
.plist .pt-ava img{width:42px;height:42px;border-radius:14px;object-fit:cover;display:block}
.plist .nm{font-weight:700;font-size:15px;letter-spacing:-.02em}
.plist .sb{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;white-space:normal}
.urg{display:inline-flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;font-weight:650}
.urg .bigdot{width:12px;height:12px}
.arow:hover{background:var(--fill)}
.arow .at-t{flex:1;min-width:0;display:flex;flex-direction:column}
.arow b{font-size:14px}
.arow small{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.arow .chev,.fpt .chev{color:var(--line);flex:none}
.ldot{width:10px;height:10px;border-radius:50%;flex:none;background:var(--line);display:inline-block}
.ldot.red{background:var(--red)}.ldot.orange{background:var(--orange)}.ldot.yellow{background:var(--yellow)}
.cdpill{flex:none;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--red-soft);color:var(--red);font-variant-numeric:tabular-nums;white-space:nowrap}
.appt{display:flex;align-items:center;gap:12px;padding:9px 4px;border-top:1px solid var(--line-2)}
.appt:first-of-type{border-top:0}
.appt.past{opacity:.5}
.at{font-weight:700;font-size:14px;width:46px;flex:none;font-family:var(--f-mono)}
.ap-t{flex:1;min-width:0;display:flex;flex-direction:column}
.ap-t b{font-size:14px}
.ap-t small{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tchip{flex:none;display:inline-flex;gap:4px;align-items:center;font-size:12px;font-weight:600;border-radius:999px;padding:3px 9px;background:var(--fill);color:var(--ink-2)}
.tchip.v{background:var(--accent-soft);color:var(--accent-ink)}
.sbars{display:flex;flex-direction:column;gap:9px;margin:4px 0}
.sbar{display:grid;grid-template-columns:minmax(0,170px) minmax(0,1fr) 22px;gap:10px;align-items:center;font-size:13px}
.sbar span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbar i{display:block;height:10px;border-radius:5px;background:var(--line);min-width:6px}
.sbar i.green{background:var(--green)}.sbar i.yellow{background:var(--yellow)}.sbar i.n{background:var(--muted)}
.sbar b{text-align:right;font-variant-numeric:tabular-nums}
.vhead{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:4px}
.vhead h1{font-size:36px;margin:0;line-height:1.06}
.fv{display:flex;flex-direction:column;gap:16px}
.fitem{display:flex;flex-direction:column;gap:6px}
.fpt{border:0;background:transparent;display:flex;align-items:center;gap:10px;padding:2px 4px;color:var(--ink);text-align:left;align-self:flex-start}
.fpt b{font-size:14px}
.fpt .fpt-m{font-size:12.5px;color:var(--muted)}
.mlist .dl-head{padding-top:14px}
.mh{font-size:26px;margin:0}
.dl.mlist li button{grid-template-columns:32px minmax(0,1fr) auto}
.mthread{display:flex;flex-direction:column;gap:10px;min-height:0;min-width:0;padding:6px 16px 14px;overflow-y:auto}
.mt-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.mt-head b{display:block;font-size:22px;line-height:1.1}
.mt-head small{color:var(--muted);font-size:12.5px}
.mt-head .btn{margin-left:auto}
.sday{display:flex;flex-direction:column;gap:8px}
.sd-h{font-family:var(--f-serif);font-size:23px;margin:0;font-weight:600}
.sd-h span{font-family:var(--f-ui);font-size:14px;color:var(--muted);font-weight:500;margin-left:6px}
.dprof{max-width:780px;width:100%;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.dp-top{display:flex;gap:18px;align-items:center;padding:4px 0}
.dp-top h1{font-size:36px;margin:0;line-height:1.06}
.sgroup{background:var(--surface);border-radius:20px;box-shadow:0 0 0 1px var(--line-2);overflow:hidden}
.sgroup h3{margin:0;padding:14px 18px 6px;font-size:13px;color:var(--muted);font-weight:600}
.srow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:11px 18px;border-top:1px solid var(--line-2);min-height:50px}
.sgroup h3 + .srow{border-top:0}
.srow.col{flex-direction:column;align-items:stretch}
.srow > span{display:flex;flex-direction:column;min-width:0}
.srow b{font-size:14px;font-weight:600}
.srow small{font-size:12.5px;color:var(--muted)}
.sval{font-size:13.5px;color:var(--ink-2);text-align:right}
.sinp{border:0;background:var(--surface-2);border-radius:10px;padding:8px 10px;font:inherit;font-size:14px;color:var(--ink);text-align:right;min-width:0;width:min(240px,50%)}
.hand-ta{font-family:var(--f-hand);font-size:25px;line-height:1.2;background:var(--note-bg);color:var(--note-ink);border-radius:6px 18px 18px 18px;padding:12px 16px;min-height:88px;font-weight:600}
.tpl{font-size:14px;color:var(--ink-2)}
.srow svg{color:var(--muted);flex:none}
.dsheet-wrap{position:absolute;inset:0;z-index:30;display:grid;place-items:center;background:rgb(0 0 0 / .24);padding:20px;animation:fade .2s}
.dsheet{width:min(580px,100%);max-height:100%;overflow-y:auto;border-radius:26px;padding:24px;display:flex;flex-direction:column;gap:14px;animation:up .25s ease-out}
.dsheet.glass{background:rgb(var(--glass-rgb) / .92)}
.dsheet h2{font-size:32px;margin:0;line-height:1.08}
.fgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@container win (max-width: 620px){.fgrid{grid-template-columns:1fr}}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row.end{justify-content:flex-end}
.inv-code{display:flex;gap:20px;align-items:center;background:var(--surface);border-radius:20px;padding:16px;box-shadow:0 0 0 1px var(--line-2);flex-wrap:wrap}
.qr{width:148px;height:148px;flex:none;border-radius:14px;background:var(--qr-bg);padding:8px;display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center}
.qr img,.qr canvas{width:132px!important;height:132px!important;display:block}
.code{display:block;font-size:34px;font-weight:700;letter-spacing:.06em;color:var(--ink)}
.inv-code small{color:var(--muted)}
.dl .sec{font-size:12px;font-weight:600;color:var(--muted);padding:10px 12px 4px}
.inv{display:flex;gap:10px;align-items:center;padding:8px 10px;border-radius:12px;font-size:13px}
.inv b{display:block}
.inv small{display:block;color:var(--muted);font-size:11.5px}
/* patient list and card (as before) */
.dl{display:flex;flex-direction:column;min-height:0;background:var(--side);-webkit-backdrop-filter:blur(24px) saturate(160%);backdrop-filter:blur(24px) saturate(160%);border:1px solid var(--glass-brd);border-radius:18px;box-shadow:0 2px 10px rgb(0 0 0 / .06)}
.dl-head{padding:12px 12px 10px;display:flex;flex-direction:column;gap:9px}
.dl-who{font-size:12px;color:var(--muted)}
.dl-who b{display:block;color:var(--ink);font-size:14px}
.cnts{display:flex;gap:4px;flex-wrap:wrap}
.flt{display:flex;gap:2px;background:var(--fill);border-radius:999px;padding:2px;align-self:flex-start;flex-wrap:wrap}
.flt button{border:0;background:transparent;border-radius:999px;padding:4px 10px;font-size:12px;font-weight:600;color:var(--ink-2)}
.flt button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 4px rgb(0 0 0 / .12)}
.dl ul{list-style:none;margin:0;padding:8px;overflow-y:auto;flex:1;min-height:0;display:flex;flex-direction:column;gap:8px}
.dl li button{width:100%;border:0;background:var(--surface);text-align:left;display:flex;gap:12px;padding:12px;align-items:center;border-radius:18px;box-shadow:0 0 0 1px var(--line-2)}
.dl li button:hover{transform:translateY(-1px);box-shadow:0 8px 20px rgb(0 0 0 / .06),0 0 0 1px var(--line)}
.dl li button[aria-current="true"]{background:var(--accent-soft);box-shadow:0 0 0 1.5px var(--accent)}

function faceSVG(v, kind = 'mood', s = 46) {
  const A = 'fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"';
  let g = '';
  if (kind === 'energy') {
    g = `<rect x="5" y="15" width="34" height="19" rx="4.5" ${A}/><path d="M42.5 21.5v6" ${A} stroke-width="3.2"/>` +
      [0, 1, 2, 3, 4].map(i => `<rect x="${9 + i * 5.8}" y="19" width="3.9" height="11" rx="1.2" fill="currentColor" opacity="${i < v ? 1 : .15}"/>`).join('');
  } else {
    g = `<circle cx="24" cy="24" r="19.5" ${A}/>`;
    const dot = r => `<circle cx="17.5" cy="20.5" r="${r}" fill="currentColor"/><circle cx="30.5" cy="20.5" r="${r}" fill="currentColor"/>`;
    const brows = `<path d="M13 15.5l6.5-2.4M35 15.5l-6.5-2.4" ${A}/>`;
    if (kind === 'anxiety') {
      g += v === 1 ? `<path d="M14.5 21q3 2.6 6 0M27.5 21q3 2.6 6 0" ${A}/>` : dot(v >= 4 ? 2.7 : 2.2);
      if (v === 5) g += brows;
      g += `<path d="${['M17 29.5q7 5 14 0', 'M17.5 30.5q6.5 2.5 13 0', 'M18 31h12', 'M16 31.5q2-2.4 4 0t4 0t4 0t4 0', 'M15.5 32q2.1-3.2 4.25 0t4.25 0t4.25 0t4.25 0'][v - 1]}" ${A}/>`;
    } else {
      g += v === 5 ? `<path d="M14.5 22q3-3.6 6 0M27.5 22q3-3.6 6 0" ${A}/>` : dot(2.2);
      if (v === 1) g += brows;
      const c = (v - 3) / 2, e = 31 - 2 * c, q = 31 + 6 * c;
      g += `<path d="M16 ${e}Q24 ${q} 32 ${e}" ${A}/>`;
    }
  }
  return `<svg width="${s}" height="${s}" viewBox="0 0 48 48" aria-hidden="true">${g}</svg>`;
}

/* ---------- registration: phone → SMS → doctor's code → consents → name → reminder → close person → Face ID ---------- */
const digits = s => (s || '').replace(/\D/g, '');
function regReset(mode = 'new') { S.reg = { mode, step: 0, phone: '', sms: '', code: '', codeOk: false, err: '', consents: { data: false, remote: false, trusted: false }, name: firstName(), remind: '20:00', notif: null, tName: 'Аня', tRel: 'сестра', tPhone: '' }; }
const REG_NEW = ['phone', 'sms', 'code', 'consent', 'name', 'remind', 'trusted', 'faceid', 'done'];
const REG_LOGIN = ['phone', 'sms'];
const regSteps = () => S.reg.mode === 'login' ? REG_LOGIN : REG_NEW;
function regValid() {
  const r = S.reg, st = regSteps()[r.step];
  if (st === 'phone') return digits(r.phone).replace(/^[78](?=\d{10}$)/, '').length === 10;
  if (st === 'sms') return digits(r.sms).length === 4;
  if (st === 'code') return r.codeOk || digits(r.code).length >= 4;
  if (st === 'consent') return r.consents.data && r.consents.remote;
  if (st === 'name') return r.name.trim().length > 0;
  return true;
}
function regNext() {
  const r = S.reg, steps = regSteps(), st = steps[r.step];
  r.err = '';
  if (!regValid()) return;
  if (st === 'sms' && digits(r.sms) !== '4271') { r.err = 'Код не подходит. Проверьте SMS.'; r.sms = ''; return; }
  if (st === 'code' && !r.codeOk) { if (digits(r.code) !== '4821') { r.err = 'Такого кода нет. Он напечатан на памятке от врача.'; return; } r.codeOk = true; return; }
  if (st === 'remind' && r.notif == null) { S.alert = { type: 'notif' }; return; }
  if (st === 'name') S.pname = r.name.trim();
  if (st === 'consent') S.prefs.consents = { ...r.consents };
  if (st === 'trusted' && r.tName.trim()) { const M = P.maria; M.tName = r.tName.trim(); M.tRel = r.tRel; if (digits(r.tPhone).length >= 10) M.tPhone = fmtPhone(r.tPhone); M.trust = `${M.tName} (${M.tRel})`; M.trustAcc = M.tName === 'Аня' ? 'Аню' : M.tName; }
  if (r.mode === 'login' && r.step === steps.length - 1) { enterApp(); return; }
  r.step++;
}
function enterApp() { S.ps = 'app'; S.route = []; S.pv = 'home'; S.ov = null; }
function regHTML() {
  const r = S.reg, steps = regSteps(), st = steps[r.step];
  if (st === 'done') return doneRegHTML();
  const n = r.mode === 'login' ? steps.length : steps.length - 1;
  const head = `<div class="rg-head"><button class="x glass" data-act="reg-back" aria-label="Назад">${ic(G.back, 22, 2.2)}</button>${dotsHTML(r.step, n)}<span class="x-sp"></span></div>`;
  const next = (label = 'Дальше') => `<button class="pbtn" data-act="reg-next" ${regValid() ? '' : 'disabled'}>${label}</button>`;
  const err = r.err ? `<p class="err" role="alert">${esc(r.err)}</p>` : '';
  let body = '', foot = '';
  if (st === 'phone') {
    body = `<h1 class="rg-h serif">${r.mode === 'login' ? 'Вход по <em>номеру</em>' : 'Ваш номер <em>телефона</em>'}</h1>
      <p class="rg-p">Пришлём код в SMS. Номер увидит только ваш врач.</p>
      <label class="field"><span class="pre">+7</span><input id="rg-phone" data-bind="reg.phone" inputmode="tel" autocomplete="tel-national" placeholder="900 000-00-00" value="${esc(r.phone)}" aria-label="Номер телефона"></label>
      <button class="hint-pill" data-act="reg-fill" data-arg="phone">${ic(G.sparkle, 16, 2)}Подставить демо-номер</button>`;
    foot = next('Получить код');
  } else if (st === 'sms') {
    body = `<h1 class="rg-h serif">Код из <em>SMS</em></h1><p class="rg-p">Отправили на ${esc(fmtPhone(r.phone))}.</p>
      <label class="field otp"><input id="rg-sms" data-bind="reg.sms" inputmode="numeric" autocomplete="one-time-code" maxlength="4" placeholder="····" value="${esc(r.sms)}" aria-label="Код из SMS"></label>${err}
      <button class="otp-sug" data-act="otp-fill">${ic(G.chat, 18, 2)}Из «Сообщений»: <b>4271</b></button>
      <p class="fine center">Новый код можно запросить через 0:59</p>`;
    foot = next('Подтвердить');
  } else if (st === 'code') {
    body = r.codeOk ? `<h1 class="rg-h serif">Это ваш <em>врач</em>?</h1><p class="rg-p">Код ${esc(r.code.toUpperCase())} выдала:</p>
      <div class="doc-ok"><span class="ava lg">ЕС</span><div><b class="serif">Елена Викторовна <em>Сухова</em></b><span>врач-психиатр</span><span>Амбулаторное отделение · кабинет 214</span></div></div>
      <button class="skip sm" data-act="code-redo">Нет, ввести другой код</button>`
      : `<h1 class="rg-h serif">Код от <em>врача</em></h1><p class="rg-p">Его дают на приёме, на памятке. Он связывает вас с вашим врачом.</p>
      <label class="field mono"><input id="rg-code" data-bind="reg.code" autocapitalize="characters" placeholder="СУХ-0000" value="${esc(r.code)}" aria-label="Код от врача"></label>${err}
      <button class="hint-pill" data-act="reg-fill" data-arg="code">${ic(G.qr, 16, 2)}Код с памятки: СУХ-4821</button>`;
    foot = next(r.codeOk ? 'Да, это мой врач' : 'Проверить код');
  } else if (st === 'consent') {
    const row = (k, t, d, req) => `<div class="lrow"><span><b>${t}${req ? '<i class="req">обязательно</i>' : ''}</b><small class="wrap">${d}</small></span><button class="sw" role="switch" aria-checked="${r.consents[k]}" data-act="consent" data-arg="${k}" aria-label="${t}"></button></div>`;
    body = `<h1 class="rg-h serif">Ваше <em>согласие</em></h1><p class="rg-p">Без первых двух врач не сможет вести вас в приложении.</p>
      <div class="list plain">${row('data', 'Данные о здоровье', 'Ответы хранятся в клинике и видны вашему врачу.', true)}${row('remote', 'Наблюдение между приёмами', 'Врач следит за динамикой и пишет вам в чат.', true)}${row('trusted', 'Сообщение близкому', 'Только если вам будет очень плохо. Можно решить позже.', false)}</div>
      <p class="fine">Подписываете кодом из SMS. Отозвать можно в профиле.</p>`;
    foot = next('Подписать');
  } else if (st === 'name') {
    body = `<h1 class="rg-h serif">Как к вам <em>обращаться</em>?</h1><p class="rg-p">Так мы будем здороваться каждый день.</p>
      <label class="field"><input id="rg-name" data-bind="reg.name" data-mirror="pv-name" value="${esc(r.name)}" autocomplete="given-name" aria-label="Имя"></label>
      <div class="preview"><span class="pv-l">Так это будет выглядеть</span><p class="serif greet-pv">${greetWord()}, <em id="pv-name">${esc(r.name)}</em></p></div>`;
    foot = next();
  } else if (st === 'remind') {
    body = `<h1 class="rg-h serif">Когда <em>напоминать</em>?</h1><p class="rg-p">Напоминание приходит раз в день и никогда ночью.</p>
      ${timesHTML(r.remind, 'remind-time')}${notifPreview(r.remind)}`;
    foot = next();
  } else if (st === 'trusted') {
    body = `<h1 class="rg-h serif">Близкий <em>человек</em></h1><p class="rg-p">Ему напишем, только если вы нажмёте «Позвать».${r.consents.trusted ? '' : ' Для этого нужно согласие, его можно дать позже.'}</p>
      <label class="field sm"><span class="lab">Имя</span><input id="rg-tname" data-bind="reg.tName" value="${esc(r.tName)}" aria-label="Имя близкого человека"></label>
      <div class="chips">${['сестра', 'брат', 'мама', 'папа', 'подруга', 'друг', 'партнёр'].map(x => `<button class="chip" data-act="rel" data-arg="${x}" aria-pressed="${r.tRel === x}">${x}</button>`).join('')}</div>
      <label class="field sm"><span class="lab">Телефон</span><span class="pre">+7</span><input id="rg-tphone" data-bind="reg.tPhone" inputmode="tel" placeholder="900 000-00-00" value="${esc(r.tPhone)}" aria-label="Телефон близкого человека"></label>`;
    foot = next('Сохранить') + `<button class="skip" data-act="reg-skip">Позже</button>`;
  } else if (st === 'faceid') {
    body = `<div class="fid-big">${ic(G.faceid, 76, 1.6)}</div><h1 class="rg-h serif center">Вход по <em>Face ID</em></h1>
      <p class="rg-p center">Приложение откроется только у вас. Ответы видите вы и ваш врач.</p>`;
    foot = `<button class="pbtn" data-act="faceid-on">Включить Face ID</button><button class="skip" data-act="faceid-skip">Не сейчас</button>`;
  }
  return `<div class="scr reg">${head}${body}<div class="rg-foot">${foot}</div></div>`;
}
function doneRegHTML() {
  return `<div class="scr welcome done-scr">${scene('rise')}
    <div class="wl-mid">${appIcon(76, true)}<h1 class="serif done-h">Всё готово, <em>${esc(firstName())}</em></h1><p class="wl-tag">Первая отметка займёт минуту.</p></div>
    <div class="wl-foot"><button class="pbtn" data-act="reg-finish" data-arg="now">Отметиться сейчас</button><button class="skip" data-act="reg-finish" data-arg="later">Позже</button></div></div>`;

const greetWord = (d = nowD()) => d.getHours() < 5 ? 'Доброй ночи' : d.getHours() < 12 ? 'Доброе утро' : d.getHours() < 18 ? 'Добрый день' : 'Добрый вечер';
const TIMES = [['09:00', 'утром', G.sun], ['13:00', 'днём', G.sun], ['20:00', 'вечером', G.sunset], ['22:00', 'перед сном', G.moon]];
const timesHTML = (cur, act) => `<div class="times">${TIMES.map(([t, w, g]) => `<button class="opt tm" data-act="${act}" data-arg="${t}" aria-pressed="${cur === t}">${ic(g, 22, 2)}<b>${t}</b><small>${w}</small></button>`).join('')}</div>`;
const notifPreview = (time = S.prefs.remind) => `<div class="npv glass">${appIcon(36)}<span><span class="bn-app">ReMind<i>${time}</i></span><b>${S.prefs.neutral ? 'Пора отметиться' : 'Как ваше настроение сегодня?'}</b><span class="bn-t">${S.prefs.neutral ? 'Отметка займёт около минуты.' : 'Отметьте настроение, сон и тревогу для врача.'}</span></span></div>`;

    <button class="lk-swipe" data-act="lock-app">Смахните вверх, чтобы открыть</button></div>`;

function fidHTML() { const f = S.fid; if (!f) return ''; return `<div class="fid-wrap" aria-live="polite"><div class="fid ${f.state}">${f.state === 'ok' ? ic(G.check, 64, 2.6) : ic(G.faceid, 64, 1.8)}<span>Face ID</span></div></div>`; }

function patDyn(p) {

  const sub = ch >= 50 ? 'Лечение помогает.' : ch >= 10 ? 'Лечение действует постепенно, и первые перемены уже заметны.'

  return `<div class="ph-top"></div>
  ${due.length ? `<div class="scale-due">${due.map(([k, t]) => `<button class="scale-ico" data-act="q-start" data-arg="${k}">${ic(k === 'madrs' ? G.heart : G.sun, 22, 2)}<span><b>${t}</b></span></button>`).join('')}</div>` : ''}
  <div class="ask-card">
    <p class="serif">Ответьте на пару вопросов о вашем состоянии сегодня</p>

  </div>
  <section class="pcard"><div class="ch-h">${ic(G.heart, 18, 2.2)}Самочувствие<span>опрос ${fmtD(last(p.madrs).date)}</span></div><p class="big-say serif">${head}</p><p class="ph-sub">${sub}</p><p class="fine" style="padding:0">По опросам о самочувствии. Баллы видит только врач.</p></section>
  <section class="pcard"><div class="ch-h">${ic(G.sun, 18, 2.2)}Настроение<span>7 дней</span></div>
    <div class="skyweek">${w.map((x, i) => `<div class="sd ${x.v ? 'm' + x.v : 'none'}" role="img" aria-label="${i === 6 ? 'сегодня' : x.date.toLocaleDateString('ru-RU', { weekday: 'long' })}: ${x.v ? FACE_L.mood[x.v - 1].toLowerCase() : 'нет отметки'}"><span class="sd-t">${x.v ? faceSVG(x.v, 'mood', 30) : ''}</span><span class="sd-l ${i === 6 ? 'td' : ''}">${i === 6 ? 'сег.' : wd(x.date)}</span></div>`).join('')}</div>
    <p class="fine" style="padding:0">Чем теплее цвет, тем легче был день.</p>
    ${a1 != null ? `<p class="ph-sub">Эта неделя: <b>${moodWord(a1)}</b>${a0 != null ? ` · прошлая: ${moodWord(a0)}` : ''}</p>` : ''}</section>
  <section class="pcard"><div class="ch-h">${ic(G.moon, 18, 2.2)}Сон<span>часов за ночь</span></div>
    <div class="sl">${sl.map((x, i) => `<div>${x.v != null ? `<b>${dec(x.v, x.v % 1 ? 1 : 0)}</b><i style="height:${Math.round(clamp(x.v, 0, 12) / 12 * 92)}px"></i>` : '<b>—</b><i class="none" style="height:20px"></i>'}<span>${i === 6 ? 'сег.' : wd(x.date)}</span></div>`).join('')}</div></section>${anonListHTML()}`;
}
function msgHTML(m, side) {

  return `<div class="msg ${mine ? 'me' : 'them'} ${side === 'doc' && m.alarm ? 'alarm' : ''}">${esc(m.text)}${scaleBtn}<time>${fmtDT(m.t)}${side === 'doc' && m.alarm ? ' · найдены тревожные слова' : ''}</time></div>`;
}

function commitResult(r) {
  const p = P.maria, score = r.score;

    else if (q10 >= 3) addFlag('maria', 'M2', { res: r.id, trigger: [['Вопрос 10', q10 + ' из 6'], ...trig] });
    const rk = mRisk(score);
    if (rk === 'high') addFlag('maria', 'M3', { res: r.id, trigger: score > 34 ? [...trig, ['Действие', 'направить к психиатру в приоритетном порядке']] : trig });

}

/* ---------- schedule ---------- */
function dSchedule() {
  const mode = S.scal || 'week';
  const today = S.sday && mode === 'day' ? (() => { const [y, m, d] = S.sday.split('-').map(Number); return new Date(y, m - 1, d); })() : day0(nowD());
  const days = mode === 'day' ? [today] : mode === 'month' ? Array.from({ length: 28 }, (_, i) => { const d = new Date(today); d.setDate(d.getDate() + i); return d; }) : [today, ...weekdaysAhead(5)];
  const head = `<div class="vhead"><h1 class="serif">Расписание</h1><div class="flt">${[['day', 'День'], ['week', 'Неделя'], ['month', 'Месяц']].map(([k, t]) => `<button data-act="scal" data-arg="${k}" aria-pressed="${mode === k}">${t}</button>`).join('')}</div></div>`;

function blankVisit(p) {

    rx: '', nonmed: '', plan: '', next: '', final: false, ai: {} };
}
function aiFor(p) {
  const preg = !isMale(p) && (p.mods || []).some(m => /беремен/i.test(m));
  const ivf = somaticStatus(p).includes('ЭКО');
  const score = last(p.madrs).score;
  const out = [
    { id: 'cbt', kind: 'Немедикаментозно', field: 'nonmed', title: 'КПТ — первая линия', text: '10–12 сессий КПТ (уровень A). Релаксация 10–15 занятий. Дыхание 10 минут в день, 14 дней. Это не замена помощи при суицидальном риске.', src: 'КР Минздрава, уровень A. Демонстрационные данные.' }
  ];
  if (preg) out.push({ id: 'swap', kind: 'Препарат', field: 'rx', title: 'Беременность: пересмотр препаратов', text: 'Эсциталопрам, Авинейро и бензодиазепины при беременности не рекомендуются. Отмена постепенная. Психотерапия предпочтительна (уровень B). Антидепрессант — только по строгим показаниям, вместе с акушером.', src: 'КР, сценарий беременности. Демонстрационные данные.' });
  if (ivf && !preg) out.push({ id: 'sert', kind: 'Препарат', field: 'rx', title: 'Подготовка к ЭКО', text: 'Если нужен препарат и беременности нет: сертралин 50 мг/сут (50–200 мг), только когда польза выше риска. Согласовать с репродуктологом. Перед назначением — тест на беременность. Эсциталопрам и Авинейро не рекомендуются.', src: SRC });
  if (/ХБП/i.test(somaticStatus(p))) out.push({ id: 'ckd', kind: 'Препарат', field: 'rx', title: 'ХБП', text: 'При ХБП дозу сертралина снижают или рассматривают миртазапин / венлафаксин с контролем почек и давления.', src: 'Клиническая фармакология. Демонстрационные данные.' });
  if (score >= 20) out.push({ id: 'step', kind: 'Повторный приём', field: 'plan', title: 'Мало эффекта', text: 'Если за 3–4 недели PHQ-9 снизился меньше чем на 50%, повысить дозу до максимальной или сменить препарат (уровень A). Психотерапия вместе с лекарством.', src: 'КР «Депрессивный эпизод», уровень A. Демонстрационные данные.' });
  out.push({ id: 'ask', kind: 'Уточнить', field: 'plan', title: 'Не хватает данных', text: (p.ther && p.ther.drug) ? 'Дозу сверяйте с историей и клиническими рекомендациями. Не добавляйте ограничения, которых нет в карте.' : 'Если нет названия препарата — дозу не предлагать, сначала уточнить.', src: 'Демонстрационные данные.' });
  return out;
}

function drawQR() {
  const q = document.getElementById('inv-qr'); if (!q || !S.invite || S.invite.step !== 'code') return;
  if (!window.QRCode) { q.textContent = 'QR-код появится, когда загрузится библиотека'; return; }
  q.innerHTML = '';
  // the code is encoded as plain ASCII text, not a link: the prototype has no real address to send people to
  try { new QRCode(q, { text: 'REMIND INVITE ' + S.invite.code.replace('СУХ', 'SUH') + ' DEMO', width: 132, height: 132, colorDark: '#111114', colorLight: '#FFFFFF', correctLevel: QRCode.CorrectLevel.M }); q.removeAttribute('title'); q.setAttribute('role', 'img'); q.setAttribute('aria-label', 'QR-код приглашения ' + S.invite.code); }
  catch (e) { q.textContent = 'QR-код'; }
}

/* ===================== render & events ===================== */

    case 'dlogin': if (!S.dl.login.trim() || !S.dl.pass) { S.dl.err = 'Введите логин и пароль.'; rd(); return; } S.dl.err = ''; S.dauth = '2fa'; rd(); focusD('dl-code'); return;
    case 'd2fa-fill': S.dl.code = '318402'; S.dl.err = ''; rd(); return;
    case 'd2fa': d2fa(); return;
    case 'd2fa-back': S.dauth = 'login'; S.dl.err = ''; S.dl.code = ''; rd(); return;
    case 'd-logout': S.dauth = 'login'; S.dl.code = ''; S.dv = 'today'; S.invite = null; rd(); renderTop(); return;
    case 'dv': S.dv = arg; if (arg === 'patients') S.openCard = false; rd(); return;
    case 'eval-therapy': S.dv = 'therapy-eval'; S.therapyPid = null; S.drugCheck = null; S.therapyFrom = 'today'; rd(); return;
    case 'eval-from-card': S.sel = arg; S.dv = 'therapy-eval'; S.therapyPid = arg; S.drugCheck = null; S.therapyFrom = 'patients'; rd(); return;
    case 'therapy-pick': S.therapyPid = arg; S.drugCheck = null; rd(); return;
    case 'therapy-back': S.drugCheck = null; S.therapyPid = null; S.dv = S.therapyFrom === 'patients' ? 'patients' : 'today'; rd(); return;
    case 'check-drug': S.drugCheck = arg; rd(); return;
    case 'check-drug-btn': S.drugCheck = arg; rd(); return;
    case 'open-pt': S.sel = arg; S.dv = 'patients'; S.openCard = true; S.tab = 'dyn'; S.invite = null; rd(); return;
    case 'open-visit': {
      if (!S.vdrafts) S.vdrafts = {};
      if (!S.vdrafts[arg] || S.vdrafts[arg].final) S.vdrafts[arg] = blankVisit(P[arg]);
      S.visit = S.vdrafts[arg]; S.sel = arg; S.dv = 'visit'; rd(); return;
    }
    case 'visit-back': S.dv = 'patients'; rd(); return;
    case 'visit-draft': infoToast('Черновик сохранён', P[S.visit.pid].name); rd(); return;
    case 'visit-final': S.visit.final = true; infoToast('Запись завершена', 'Поля больше не меняются'); rd(); return;
    case 'ai-add': {
      const [id, field] = arg.split('|'); const p = P[S.visit.pid]; const r = aiFor(p).find(x => x.id === id);
      const st = S.visit.ai[id] || { text: r.text, state: 'new' };
      if (!String(S.visit[field] || '').includes(st.text)) S.visit[field] = (S.visit[field] ? S.visit[field] + '\n' : '') + st.text;
      S.visit.ai[id] = { state: 'added', text: st.text }; rd(); return;
    }
    case 'ai-edit': { const r = aiFor(P[S.visit.pid]).find(x => x.id === arg); const st = S.visit.ai[arg] || { text: r.text }; S.visit.ai[arg] = { state: 'edit', text: st.text }; rd(); return; }
    case 'ai-save': { const ta = document.getElementById('ai-' + arg); const prev = S.visit.ai[arg] || { text: '' }; S.visit.ai[arg] = { state: 'new', text: ta ? ta.value : prev.text }; rd(); return; }
    case 'ai-reject': { const r = aiFor(P[S.visit.pid]).find(x => x.id === arg); const prev = S.visit.ai[arg] || { text: r.text }; S.visit.ai[arg] = { state: 'rejected', text: prev.text }; rd(); return; }
    case 'scal': S.scal = arg; if (arg !== 'day') S.sday = null; rd(); return;
    case 'scal-day': S.scal = 'day'; S.sday = arg; rd(); return;
    case 'open-flag': { const f = FLAGS.find(x => x.id === arg); if (f) { S.flagId = f.id; S.dv = 'flag'; } rd(); return; }
    case 'msel': S.msel = arg; rd(); return;
    case 'ff': S.ff = arg; rd(); return;
    case 'dpref': S.dprefs[arg] = !S.dprefs[arg]; rd(); return;
    case 'sel': S.sel = arg; S.openCard = true; S.tab = 'dyn'; rd(); return;
    case 'close-card': S.openCard = false; rd(); return;
    case 'filter': S.filter = arg; rd(); return;
    case 'tab': S.tab = arg; if (arg === 'chat') S.chatBottom = true; rd(); return;
    /* ----- doctor: invite ----- */
    case 'invite': S.invite = { step: 'form', name: '', phone: '', dx: 'F32.1', start: isoDate(nowD()), phase: 'острая', mods: [], err: '' }; rd(); focusD('inv-name'); return;
    case 'inv-mod': { const v = S.invite; v.mods = v.mods.includes(arg) ? v.mods.filter(x => x !== arg) : [...v.mods, arg]; rd(); return; }
    case 'inv-create': { const v = S.invite; if (!v.name.trim()) { v.err = 'Укажите имя пациента.'; rd(); focusD('inv-name'); return; } v.err = ''; v.code = 'СУХ-' + (1000 + Math.floor(Math.random() * 9000)); v.step = 'code'; rd(); return; }
    case 'inv-sms': S.invite.sent = true; rd(); return;
    case 'inv-done': INVITES.unshift({ name: S.invite.name.trim(), code: S.invite.code, t: nowD() }); S.invite = null; S.dv = 'patients'; rd(); return;
    case 'inv-close': S.invite = null; rd(); return;
    case 'inv-bg': if (e.target === el) { S.invite = null; rd(); } return;
    /* ----- doctor: flags, toasts, chat ----- */
    case 'toast-open': { const f = FLAGS.find(x => x.id === arg); if (f) { S.sel = f.pid; S.dv = 'patients'; S.tab = 'dyn'; S.openWhy[f.id] = true; if (effMode() === 'patient') S.mode = innerWidth >= 1100 ? 'both' : 'doctor'; } S.toasts = S.toasts.filter(t => t.fid !== arg); renderStage(); return; }
    case 'toast-x': S.toasts = S.toasts.filter(t => t.fid !== arg && t.id !== arg); rd(); return;
    case 'f-accept': { const f = FLAGS.find(x => x.id === arg); f.status = 'work'; f.accepted = nowD(); S.toasts = S.toasts.filter(t => t.fid !== arg); rd(); renderTop(); return; }
    case 'f-action': { const [id, a] = arg.split('|'); const f = FLAGS.find(x => x.id === id); const ta = document.getElementById('fc-' + id); S.fui[id] = { comment: ta ? ta.value : '' }; f.action = f.action === a ? null : a; rd(); return; }
    case 'f-close': { const f = FLAGS.find(x => x.id === arg); const ta = document.getElementById('fc-' + arg); const c = ta ? ta.value.trim() : ''; if (!c) return; if (!f.action) f.action = 'Сделано'; f.status = 'closed'; f.closed = nowD(); f.comment = c; delete S.fui[arg]; rd(); renderTop(); return; }
    case 'f-hint': { const i = arg.indexOf('|'); const id = arg.slice(0, i), text = arg.slice(i + 1); const f = FLAGS.find(x => x.id === id); if (!f) return; f.action = text; f.comment = text; f.status = 'closed'; f.closed = nowD(); if (!f.accepted) f.accepted = nowD(); rd(); renderTop(); return; }
    case 'f-fill': { const i = arg.indexOf('|'); const id = arg.slice(0, i), text = arg.slice(i + 1); S.fui[id] = { comment: text }; rd(); return; }
    case 'mc-act': case 'mc-note': {
      const [pid, id, what] = arg.split('|'), e = P[pid].madrs.find(x => x.id === id); if (!e) return;
      const ta = document.getElementById('mc-c-' + id), c = ta ? ta.value.trim() : '';
      if (act === 'mc-note' && !c) { focusEl(ta); return; }
      e.acts.push({ t: nowD(), who: 'Сухова Е. В.', a: act === 'mc-note' ? 'Комментарий' : what, c }); if (ta) ta.value = '';
      // «Связались» on the result also accepts the open PHQ-9 flags of this patient (the team's rule: no mark — escalation)
      if (act === 'mc-act' && what.startsWith('Связались')) FLAGS.filter(f => f.pid === pid && f.status === 'new' && /^M[1-4]$/.test(f.rule)).forEach(f => { f.status = 'work'; f.accepted = nowD(); f.action = what; S.toasts = S.toasts.filter(t => t.fid !== f.id); });
      rd(); renderTop(); return;
    }
    case 'dc-tpl': { const ta = el.closest('.dcompose')?.querySelector('textarea'); if (ta) { ta.value = TEMPLATES[+arg]; focusEl(ta); } return; }
    case 'dc-send': { const ta = el.closest('.dcompose')?.querySelector('textarea'), t = (ta && ta.value || '').trim(); if (!t) return; P[arg].chat.push({ from: 'doc', text: t, t: nowD(), unreadP: true }); ta.value = ''; S.chatBottom = true; rd(); patientHears(arg, t); return; }
    case 'dc-scale': { const [pid, k] = arg.split('|'), I = INST[k], p = P[pid]; if (!p.inbox) p.inbox = {}; p.inbox[k] = 'doctor'; S.sendMenu = null; p.chat.push({ from: 'doc', kind: 'scale', inst: k, text: `Пожалуйста, пройдите ${I.ask} (${I.title}).`, t: nowD(), unreadP: true }); if (S.dv === 'patients') S.tab = 'chat'; S.chatBottom = true; rd(); if (pid === 'maria') renderPatient(); patientHears(pid, `Пожалуйста, пройдите ${I.ask}.`); return; }
    case 'send-menu': S.sendMenu = S.sendMenu === arg ? null : arg; rd(); return;
    case 'demo': runDemo(arg); return;
  }
});

// inputs bound to state: typing never re-renders the field being typed in
const BIND = { reg: () => S.reg, prefs: () => S.prefs, dl: () => S.dl, invite: () => S.invite, dprefs: () => S.dprefs, th: () => S.th, visit: () => S.visit };
document.addEventListener('input', e => {
  const t = e.target, b = t.dataset && t.dataset.bind;
  if (t.id === 'pt-q') { S.pq = t.value; const pos = t.selectionStart; rd(); const n = document.getElementById('pt-q'); if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (err) {} } return; }
  if (t.id === 'pt-dx') { S.fdx = t.value; rd(); return; }
  if (b) {
    const [root, key] = b.split('.'), obj = BIND[root] && BIND[root](); if (!obj) return;
    if (b === 'prefs.glassA') { const v = +t.value; S.prefs.glassA = v; document.getElementById('phone')?.style.setProperty('--glass-a', v); t.style.setProperty('--pct', Math.round((v - .2) / .75 * 100) + '%'); return; }
    obj[key] = t.value;
    if (t.dataset.mirror) { const m = document.getElementById(t.dataset.mirror); if (m) m.textContent = t.value; }
    if (root === 'reg') {
      if (S.reg.err) { S.reg.err = ''; document.querySelector('#phone .err')?.remove(); }
      const btn = document.querySelector('#phone [data-act="reg-next"]'); if (btn) btn.disabled = !regValid();
      if (key === 'sms' && digits(t.value).length === 4) { regNext(); renderPatient(); focusReg(); }
    }
    if (root === 'dl' && key === 'code' && digits(t.value).length === 6) d2fa();
    if (root === 'dprefs') renderPatient();
    return;
  }
  const fc = t.dataset && t.dataset.fc;
  if (fc) { S.fui[fc] = { comment: t.value }; const btn = document.querySelector(`[data-act="f-close"][data-arg="${fc}"]`); if (btn) btn.disabled = !t.value.trim(); }
});
document.addEventListener('toggle', e => { const id = e.target.dataset && e.target.dataset.why; if (id) S.openWhy[id] = e.target.open; }, true);
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) {
    const t = e.target, id = t.id || '';
    if (id === 'pc-input') { e.preventDefault(); pcSend(); return; }
    if (t.tagName === 'INPUT' && t.closest('#phone .reg')) { e.preventDefault(); if (regValid()) { regNext(); renderPatient(); focusReg(); } return; }
    if (id === 'dl-login' || id === 'dl-pass') { e.preventDefault(); document.querySelector('[data-act="dlogin"]')?.click(); return; }
    if (id === 'dl-code') { e.preventDefault(); d2fa(); return; }
  }
  if (e.key === 'Escape') { if (S.demo) { S.demo = false; renderDemo(); renderTop(); } else if (S.invite) { S.invite = null; renderDoctor(); } }
});

/* ===================== demo scenarios ===================== */
function ensureIn() { if (S.ps !== 'app') { S.ps = 'app'; S.lock = null; } S.route = []; S.banner = null; S.alert = null; S.fid = null; S.dauth = 'in'; }
function showDoctor() { if (effMode() === 'patient') S.mode = innerWidth >= 1100 ? 'both' : 'doctor'; }
function showPatient() { if (S.mode === 'doctor') S.mode = innerWidth >= 1100 ? 'both' : 'patient'; }
function runDemo(k) {
  S.demo = false; renderDemo();
  if (k === 'first') { showPatient(); S.ps = 'welcome'; S.ob = 0; S.ov = null; S.route = []; regReset(); }
  if (k === 'lock') { showPatient(); S.ps = 'lock'; S.lock = { exp: false }; S.ov = null; S.route = []; }
  if (k === 'relogin') { showPatient(); S.ps = 'login'; S.ov = null; S.route = []; }
  if (k === 'dlogin') { showDoctor(); S.dauth = 'login'; S.dl.code = ''; S.dl.err = ''; S.invite = null; }
  if (k === 'skip') { ensureIn(); S.pv = 'home'; S.ov = null; S.dv = 'today'; }
  if (k === 'invite') { ensureIn(); showDoctor(); S.invite = { step: 'form', name: 'Ирина Соколова', phone: '+7 900 000-55-21', dx: 'F32.1', start: isoDate(nowD()), phase: 'острая', mods: ['Живёт одна'], err: '' }; }
  if (['risk', 'madrs', 'chat', 'hypo', 'anon-me'].includes(k)) { ensureIn(); showPatient(); S.sel = 'maria'; S.dv = 'patients'; S.tab = 'dyn'; S.invite = null; }
  if (k === 'risk') { S.pv = 'home'; ciStart({ mood: 1, interest: 1, energy: 2, sleep: 5, early: true, anxiety: 5 }); S.ov.step = 6; }
  if (k === 'madrs') { S.pv = 'home'; S.ov = { type: 'quest', inst: 'madrs', i: 9, ans: [3, 4, 3, 3, 2, 3, 3, 3, 0] }; }
  if (k === 'anon-me') { S.pv = 'home'; S.ov = { type: 'qintro', inst: 'madrs' }; }
  if (k === 'anon-guest') { showPatient(); S.ps = 'anon'; S.ov = null; S.route = []; }
  if (k === 'chat') { S.pv = 'chat'; S.ov = null; renderStage(); const ta = document.getElementById('pc-input'); if (ta) { ta.value = 'Устала от всего. Иногда думаю, что лучше бы меня не было.'; focusEl(ta); } scrollChat(); return; }
  if (k === 'hypo') { const p = P.maria; [2, 1].forEach(d => { p.daily = p.daily.filter(e => !sameDay(e.date, dAgo(d))); p.daily.push({ date: at(d, 21, 0), mood: 4, interest: 4, energy: 4, anxiety: 2, sleep: d === 2 ? 4 : 3.5, early: false, si: false, factors: [], note: '' }); }); S.pv = 'home'; ciStart({ mood: 4, interest: 4, energy: 5, sleep: 3, early: false, anxiety: 1 }); S.ov.step = 2; }
  if (k === 'igor' || k === 'oleg' || k === 'pavel') { ensureIn(); showDoctor(); S.sel = k; S.dv = 'patients'; S.tab = k === 'pavel' ? 'diary' : 'dyn'; S.invite = null; }
  if (k === 'ther') { ensureIn(); showPatient(); S.sel = 'maria'; S.dv = 'patients'; S.tab = 'ans'; S.invite = null; S.pv = 'home'; S.ov = null; S.route = ['profile', 'therapy']; S.th = null; }
  if (k === 'esc') { S.sim += 15; }
  if (k === 'reset') { S.sim = 0; S.pv = 'home'; S.ov = null; S.route = []; S.sel = 'maria'; S.msel = 'maria'; S.tab = 'dyn'; S.filter = 'all'; S.ff = 'active'; S.dv = 'today'; S.asrmDue = false; S.mSuggest = false; S.pendingFloor = null; S.banner = null; S.anon = []; buildData(); }
  renderStage();
}

/* tooltip */
const tip = document.getElementById('tip');
document.addEventListener('pointerover', e => { const t = e.target.closest && e.target.closest('[data-tip]'); if (!t) return; tip.textContent = t.getAttribute('data-tip'); tip.hidden = false; });
document.addEventListener('pointermove', e => { if (tip.hidden) return; const x = Math.min(e.clientX + 14, innerWidth - tip.offsetWidth - 8), y = e.clientY + 16 + tip.offsetHeight > innerHeight ? e.clientY - tip.offsetHeight - 10 : e.clientY + 16; tip.style.left = x + 'px'; tip.style.top = y + 'px'; });
document.addEventListener('pointerout', e => { const t = e.target.closest && e.target.closest('[data-tip]'); if (t) tip.hidden = true; });
// only a change of width re-lays the stage: a phone keyboard changes the height and must not steal focus from a field
let rz, lastW = innerWidth; addEventListener('resize', () => { if (innerWidth === lastW) return; lastW = innerWidth; clearTimeout(rz); rz = setTimeout(renderStage, 150); });

try { const th = localStorage.getItem('remind-theme') || localStorage.getItem('svetlee-theme'); if (th === 'light' || th === 'dark') document.documentElement.dataset.theme = th; } catch (err) { }
// keep the toolbar icon true when the system theme or the host page's theme changes underneath
try { matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => renderTop()); } catch (err) { }
new MutationObserver(() => renderTop()).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
buildData();
regReset();
renderStage();

</script>
